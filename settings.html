<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pomodoro - Setting</title>
  <link rel="stylesheet" href="settings.css" />
</head>
<body>
  <main class="settings-card">
    <h3 class="settings-title">Setting</h3>

    <div class="field">
      <label for="focus-minutes" class="field-label">타이머 시간 (분)</label>
      <input
        type="number"
        id="focus-minutes"
        class="field-input"
        name="focus-minutes"
        min="1"
        max="60"
        value="25"
      />
    </div>

    <button type="button" class="btn-back btn-save">저장</button>
    <a href="index.html" class="btn-back">메인으로 돌아가기</a>
  </main>

  <script src="settings.js"></script>
</body>
</html>
